name: image

# Builds the exact image Railway builds, then boots it and asserts the things
# a bad deploy would silently break: packages resolving from the volume,
# agent files parsing, session daemon + web server coming up, and the auth
# gateway neither leaking nor over-blocking.
on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Validate static files
        run: |
          set -eux
          bash -n start.sh
          bash -n scripts/smoke-test.sh
          node --check gateway/server.js
          jq empty defaults.json railway.json
          # Railway rejects Dockerfiles containing VOLUME
          ! grep -nE '^[[:space:]]*VOLUME' Dockerfile
          # Railway ignores HEALTHCHECK; healthcheckPath must live in railway.json
          ! grep -nE '^[[:space:]]*HEALTHCHECK' Dockerfile
          jq -e '.deploy.healthcheckPath == "/healthz"' railway.json

      - uses: docker/setup-buildx-action@v3

      - name: Build image (Railway's builder is Dockerfile; same file)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pi-web-railway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Failures are reported as check-run annotations: that is readable through
      # the API even when artifact/log endpoints are unreachable.
      - name: Smoke test inside the image
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          docker run --rm --name smoke -e SMOKE_TEST=1 \
            pi-web-railway:ci /app/scripts/smoke-test.sh > /tmp/smoke.log 2>&1
          STATUS=$?
          sed 's/\x1b\[[0-9;]*m//g' /tmp/smoke.log || true

          if [ "$STATUS" -ne 0 ]; then
            BODY=$(printf '%s\n' \
              "smoke test failed inside the built image." \
              "" \
              "$(grep -E 'FAIL|passed,' /tmp/smoke.log | sed 's/\x1b\[[0-9;]*m//g' | tail -20)" \
              "" \
              "full log: $RUN_URL")
            gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
              -X POST \
              -f name="smoke-test-details" \
              -f head_sha="${GITHUB_SHA}" \
              -f status=completed \
              -f conclusion=failure \
              -f "output[title]=smoke test failed" \
              -f "output[summary]=$BODY" \
              -F "output[annotations][][path]=scripts/smoke-test.sh" >/dev/null 2>&1 || true
            exit "$STATUS"
          fi

      - name: Confirm the container does not need Docker's VOLUME
        run: |
          set -eux
          # Railway mounts /data at runtime; the image must boot without it and
          # must warn loudly rather than silently losing state.
          docker run --rm -e SMOKE_TEST=1 pi-web-railway:ci \
            bash -c '/app/start.sh 2>&1 | head -40 & sleep 12; kill %1 2>/dev/null; true' \
            | tee /tmp/boot.log
          grep -q "NOT a mounted Railway Volume" /tmp/boot.log
          grep -q "node heap:" /tmp/boot.log
